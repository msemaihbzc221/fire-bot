<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소방청 위험물 실시간 검색</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background-color: #f5f5f5; }
        h1 { color: #d9534f; text-align: center; }
        .time { text-align: center; color: #666; margin-bottom: 20px; font-weight: bold; }
        .search-container { text-align: center; margin-bottom: 20px; }
        #search-input { width: 60%; padding: 12px; font-size: 16px; border: 2px solid #d9534f; border-radius: 4px; outline: none; }
        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #d9534f; color: white; }
        tr:hover { background-color: #f1f1f1; }
    </style>
</head>
<body>

    <h1>🚒 소방청 위험물 실시간 검색</h1>
    <div class="time" id="update-time">데이터 구조 분석 중... 잠시만 기다려주세요.</div>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="찾으시는 위험물 명칭이나 CAS 번호를 입력하세요...">
    </div>

    <table id="data-table">
        <thead>
            <tr>
                <th>번호</th>
                <th>위험물 명칭 (Chemical Name)</th>
                <th>CAS 번호</th>
                <th>위험물 유별 (Hazard Class)</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>

    <script>
        let allItems = []; 

        // 1. 캐시 방지 주소로 데이터 가져오기
        fetch('./data.json?v=' + Math.random())
            .then(response => {
                if (!response.ok) throw new Error('네트워크 응답 실패');
                return response.text(); // 💥 일단 텍스트로 안전하게 받기
            })
            .then(text => {
                try {
                    // 혹시 모를 공백이나 깨진 문자 방어하며 JSON 변환
                    const data = JSON.parse(text.trim());
                    
                    // 소방청 API 구조가 다를 수 있으므로 여러 경로 검색 (철벽 방어)
                    if (data && data.body && data.body.items) {
                        allItems = data.body.items;
                    } else if (data && data.items) {
                        allItems = data.items;
                    } else if (Array.isArray(data)) {
                        allItems = data;
                    } else {
                        throw new Error('알 수 없는 데이터 구조');
                    }

                    // 배열이 맞는지 한 번 더 확인
                    if (!Array.isArray(allItems)) {
                        allItems = Object.values(allItems);
                    }

                    document.getElementById('update-time').innerText = `총 ${allItems.length}개의 위험물 데이터 연결 완료 ✨`;

                    // 처음에는 렉 방지를 위해 50개만 노출
                    displayData(allItems.slice(0, 50));

                } catch (e) {
                    console.error('해석 에러:', e);
                    document.getElementById('update-time').innerText = '데이터 해석 중 오류가 발생했습니다. (대용량 구조 최적화 필요)';
                }
            })
            .catch(error => {
                console.error('통신 에러:', error);
                document.getElementById('update-time').innerText = '데이터 파일을 읽어오지 못했습니다. 잠시 후 새로고침 해주세요.';
            });

        // 2. 화면에 데이터를 표로 그려주는 고성능 함수
        function displayData(items) {
            const tableBody = document.querySelector('#data-table tbody');
            let htmlRows = ''; 

            if(!items || items.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#999;">검색 결과가 없습니다.</td></tr>`;
                return;
            }

            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                if (!item) continue;
                
                // API 속성명이 대소문자가 다르거나 바뀔 경우를 모두 대비
                const name = item.chemicalname || item.chemicalName || item.CHEMICALNAME || '정보 없음';
                const cas = item.casno || item.casNo || item.CASNO || '-';
                const hClass = item.hazardmaterialclass || item.hazardMaterialClass || item.hazardmaterialClass || '정보 없음';

                htmlRows += `<tr>
                    <td>${i + 1}</td>
                    <td><strong>${name}</strong></td>
                    <td>${cas}</td>
                    <td>${hClass}</td>
                </tr>`;
            }
            
            tableBody.innerHTML = htmlRows;
        }

        // 3. 실시간 검색 기능
        document.getElementById('search-input').addEventListener('input', function(e) {
            const keyword = e.target.value.trim().toLowerCase(); 
            
            if (!keyword) {
                displayData(allItems.slice(0, 50));
                return;
            }

            const filtered = allItems.filter(item => {
                if (!item) return false;
                const name = (item.chemicalname || item.chemicalName || '').toLowerCase();
                const cas = (item.casno || item.casNo || '').toLowerCase();
                return name.includes(keyword) || cas.includes(keyword);
            });

            displayData(filtered.slice(0, 100)); 
        });
    </script>
</body>
</html>
