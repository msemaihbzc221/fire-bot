<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소방청 위험물 정보 대시보드</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background-color: #f5f5f5; }
        h1 { color: #d9534f; text-align: center; }
        .time { text-align: center; color: #666; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #d9534f; color: white; }
        tr:hover { background-color: #f1f1f1; }
    </style>
</head>
<body>

    <h1>🚒 소방청 위험물 정보 목록</h1>
    <div class="time" id="update-time">데이터 로딩 중...</div>

    <table id="data-table">
        <thead>
            <tr>
                <th>번호</th>
                <th>위험물 명칭 (Chemical Name)</th>
                <th>CAS 번호</th>
                <th>위험물 유별 (Hazard Class)</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>

    <script>
        fetch('./data.json')
            .then(response => response.json())
            .then(data => {
                // 올려주신 데이터 구조(data.body.items)에 정확히 접근
                const list = data.body.items; 
                const tableBody = document.querySelector('#data-table tbody');
                
                // 상단에 정상 수신 메시지 출력
                document.getElementById('update-time').innerText = `최신 업데이트 상태: ${data.header.resultMsg} (정상 연결 완료)`;

                // 가져온 100개의 데이터를 표에 한 줄씩 채워넣기
                list.forEach((item, index) => {
                    const row = `<tr>
                        <td>${index + 1}</td>
                        <td><strong>${item.chemicalname || '정보 없음'}</strong></td>
                        <td>${item.casno || '-'}</td>
                        <td>${item.hazardmaterialclass || '정보 없음'}</td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });
            })
            .catch(error => {
                console.error('에러 발생:', error);
                document.getElementById('update-time').innerText = '데이터를 불러오는 중 오류가 발생했습니다.';
            });
    </script>
</body>
</html>
